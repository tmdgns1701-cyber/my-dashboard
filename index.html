<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업 대시보드</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --blue:#2563eb;
    --blue-light:#dbeafe;
    --blue-soft:#eff6ff;
    --gray-900:#111827;
    --gray-600:#4b5563;
    --gray-400:#9ca3af;
    --gray-200:#e5e7eb;
    --gray-100:#f3f4f6;
    --bg:#ffffff;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--gray-900);
    padding:20px;
  }
  h1{
    font-size:22px;
    font-weight:700;
    margin:0 0 20px 2px;
  }
  .grid-cards{
    display:grid;
    grid-template-columns:1.6fr 1fr 1fr 1fr;
    gap:14px;
    margin-bottom:16px;
  }
  .card{
    background:#fff;
    border:1px solid var(--gray-200);
    border-radius:var(--radius);
    padding:20px;
  }
  .card-label{
    font-size:13px;
    color:var(--gray-600);
    font-weight:600;
    margin-bottom:8px;
  }
  .card-main .card-value{
    font-size:34px;
    font-weight:800;
    color:var(--blue);
    line-height:1.1;
  }
  .card .card-value{
    font-size:22px;
    font-weight:800;
    color:var(--gray-900);
  }
  .card-sub{
    font-size:12.5px;
    color:var(--gray-400);
    margin-top:4px;
  }
  .progress-track{
    margin-top:14px;
    height:8px;
    border-radius:999px;
    background:var(--gray-100);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--blue);
    border-radius:999px;
    transition:width .6s ease;
  }
  .progress-text{
    margin-top:6px;
    font-size:12.5px;
    color:var(--blue);
    font-weight:700;
  }
  .grid-charts{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:14px;
    margin-bottom:16px;
  }
  .grid-rank{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .panel-title{
    font-size:15px;
    font-weight:700;
    margin-bottom:16px;
    color:var(--gray-900);
  }
  .rank-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .rank-idx{
    width:20px;
    font-size:12px;
    font-weight:700;
    color:var(--gray-400);
    flex-shrink:0;
  }
  .rank-name{
    width:74px;
    font-size:13px;
    font-weight:600;
    color:var(--gray-900);
    flex-shrink:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .rank-bar-track{
    flex:1;
    height:14px;
    background:var(--gray-100);
    border-radius:999px;
    overflow:hidden;
  }
  .rank-bar-fill{
    height:100%;
    background:var(--blue);
    border-radius:999px;
    transition:width .6s ease;
  }
  .rank-amount{
    width:88px;
    text-align:right;
    font-size:12.5px;
    font-weight:700;
    color:var(--gray-600);
    flex-shrink:0;
  }
  .empty-msg{
    font-size:13px;
    color:var(--gray-400);
    padding:20px 0;
    text-align:center;
  }
  svg text{
    font-family:'Pretendard', sans-serif;
  }
  @media (max-width:900px){
    .grid-cards{grid-template-columns:1fr 1fr;}
    .grid-charts{grid-template-columns:1fr;}
    .grid-rank{grid-template-columns:1fr;}
  }
  @media (max-width:480px){
    .grid-cards{grid-template-columns:1fr;}
    .rank-name{width:56px;}
    .rank-amount{width:70px;}
  }
</style>
</head>
<body>

<h1>영업 대시보드</h1>

<div class="grid-cards">
  <div class="card card-main">
    <div class="card-label">이번 달 매출</div>
    <div class="card-value" id="kpi-revenue">-</div>
    <div class="progress-track"><div class="progress-fill" id="kpi-progress-fill" style="width:0%"></div></div>
    <div class="progress-text" id="kpi-progress-text">목표 대비 -%</div>
  </div>
  <div class="card">
    <div class="card-label">이번 달 목표</div>
    <div class="card-value" id="kpi-target">-</div>
    <div class="card-sub" id="kpi-remaining">남은 금액 -</div>
  </div>
  <div class="card">
    <div class="card-label">객단가</div>
    <div class="card-value" id="kpi-aov">-</div>
    <div class="card-sub">매출 ÷ 계약 건수</div>
  </div>
  <div class="card">
    <div class="card-label">계약 건수</div>
    <div class="card-value" id="kpi-deals">-</div>
    <div class="card-sub">파이프라인 최종 단계</div>
  </div>
</div>

<div class="grid-charts">
  <div class="card">
    <div class="panel-title">월별 매출</div>
    <div id="bar-chart"><div class="empty-msg">불러오는 중...</div></div>
  </div>
  <div class="card">
    <div class="panel-title">영업 단계 깔때기</div>
    <div id="funnel-chart"><div class="empty-msg">불러오는 중...</div></div>
  </div>
</div>

<div class="grid-rank">
  <div class="card">
    <div class="panel-title">담당자별 순위</div>
    <div id="rank-person"><div class="empty-msg">불러오는 중...</div></div>
  </div>
  <div class="card">
    <div class="panel-title">상품별 순위</div>
    <div id="rank-product"><div class="empty-msg">불러오는 중...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const db = createClient(
  "https://clbhugzebzxcjlebkndn.supabase.co",
  "sb_publishable_bWxaz-8wu-TR-SGOdhlkpg_3-bzF1AN"
);

function won(n){
  n = Number(n) || 0;
  return n.toLocaleString('ko-KR') + '원';
}
function wonShort(n){
  n = Number(n) || 0;
  if (Math.abs(n) >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'') + '억원';
  if (Math.abs(n) >= 10000) return Math.round(n/10000).toLocaleString('ko-KR') + '만원';
  return n.toLocaleString('ko-KR') + '원';
}

async function loadAll(){
  const [monthlyRes, pipelineRes, rankRes] = await Promise.all([
    db.from('sales_monthly').select('*').order('sort_order', { ascending: true }),
    db.from('sales_pipeline').select('*').order('sort_order', { ascending: true }),
    db.from('sales_rank').select('*')
  ]);

  if (monthlyRes.error) console.error(monthlyRes.error);
  if (pipelineRes.error) console.error(pipelineRes.error);
  if (rankRes.error) console.error(rankRes.error);

  const monthly = monthlyRes.data || [];
  const pipeline = pipelineRes.data || [];
  const rank = rankRes.data || [];

  renderKPIs(monthly, pipeline);
  renderBarChart(monthly);
  renderFunnel(pipeline);
  renderRank('rank-person', rank.filter(r => r.kind === 'person'));
  renderRank('rank-product', rank.filter(r => r.kind === 'product'));
}

function renderKPIs(monthly, pipeline){
  if (!monthly.length){
    document.getElementById('kpi-revenue').textContent = '데이터 없음';
    return;
  }
  const cur = monthly[monthly.length - 1];
  const revenue = Number(cur.revenue) || 0;
  const target = Number(cur.target) || 0;
  const rate = target > 0 ? Math.round((revenue / target) * 1000) / 10 : 0;
  const remaining = target - revenue;
  const deals = pipeline.length ? Number(pipeline[pipeline.length - 1].count) || 0 : 0;
  const aov = deals > 0 ? Math.round(revenue / deals) : 0;

  document.getElementById('kpi-revenue').textContent = won(revenue);
  document.getElementById('kpi-progress-fill').style.width = Math.min(rate, 100) + '%';
  document.getElementById('kpi-progress-text').textContent = '목표 대비 ' + rate + '%';

  document.getElementById('kpi-target').textContent = won(target);
  document.getElementById('kpi-remaining').textContent = remaining > 0
    ? ('남은 금액 ' + won(remaining))
    : ('목표 초과 달성 ' + won(Math.abs(remaining)));

  document.getElementById('kpi-aov').textContent = won(aov);
  document.getElementById('kpi-deals').textContent = deals.toLocaleString('ko-KR') + '건';
}

function renderBarChart(monthly){
  const el = document.getElementById('bar-chart');
  if (!monthly.length){ el.innerHTML = '<div class="empty-msg">데이터가 없습니다</div>'; return; }

  const W = 640, H = 300;
  const padL = 56, padR = 16, padT = 20, padB = 34;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  const maxVal = Math.max(...monthly.map(m => Math.max(Number(m.revenue)||0, Number(m.target)||0))) * 1.15 || 1;
  const n = monthly.length;
  const slot = chartW / n;
  const barW = Math.min(slot * 0.5, 46);
  const curIdx = n - 1;

  const yTicks = 4;
  let gridSvg = '';
  for (let i = 0; i <= yTicks; i++){
    const val = maxVal * i / yTicks;
    const y = padT + chartH - (val / maxVal) * chartH;
    gridSvg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#f0f1f3" stroke-width="1"/>`;
    gridSvg += `<text x="${padL-8}" y="${y+4}" font-size="10" fill="#9ca3af" text-anchor="end">${wonShort(val)}</text>`;
  }

  let barsSvg = '';
  let labelsSvg = '';
  monthly.forEach((m, i) => {
    const rev = Number(m.revenue) || 0;
    const x = padL + i * slot + (slot - barW) / 2;
    const barH = (rev / maxVal) * chartH;
    const y = padT + chartH - barH;
    const fill = i === curIdx ? 'var(--blue)' : '#c7d9fb';
    barsSvg += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" fill="${fill}"/>`;
    labelsSvg += `<text x="${x + barW/2}" y="${padT+chartH+18}" font-size="11" fill="#6b7280" text-anchor="middle">${m.month}</text>`;
  });

  const targetPoints = monthly.map((m, i) => {
    const t = Number(m.target) || 0;
    const x = padL + i * slot + slot / 2;
    const y = padT + chartH - (t / maxVal) * chartH;
    return `${x},${y}`;
  }).join(' ');

  const svg = `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    ${gridSvg}
    ${barsSvg}
    <polyline points="${targetPoints}" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="6 5"/>
    ${labelsSvg}
  </svg>
  <div style="display:flex;gap:16px;margin-top:6px;font-size:12px;color:var(--gray-600);">
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--blue);border-radius:2px;margin-right:5px;"></span>이번 달</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:#c7d9fb;border-radius:2px;margin-right:5px;"></span>이전 달</span>
    <span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed #f97316;margin-right:5px;vertical-align:middle;"></span>목표</span>
  </div>`;
  el.innerHTML = svg;
}

function renderFunnel(pipeline){
  const el = document.getElementById('funnel-chart');
  if (!pipeline.length){ el.innerHTML = '<div class="empty-msg">데이터가 없습니다</div>'; return; }

  const maxCount = Number(pipeline[0].count) || 1;
  const first = Number(pipeline[0].count) || 0;
  const last = Number(pipeline[pipeline.length - 1].count) || 0;
  const finalRate = first > 0 ? Math.round((last / first) * 1000) / 10 : 0;

  let html = '';
  pipeline.forEach((p, i) => {
    const count = Number(p.count) || 0;
    const widthPct = Math.max((count / maxCount) * 100, 8);
    html += `
      <div style="margin-bottom:${i === pipeline.length - 1 ? '4' : '10'}px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
          <span style="font-weight:600;color:var(--gray-900);">${p.stage}</span>
          <span style="font-weight:700;color:var(--blue);">${count.toLocaleString('ko-KR')}</span>
        </div>
        <div style="height:26px;background:var(--gray-100);border-radius:6px;overflow:hidden;">
          <div style="height:100%;width:${widthPct}%;background:var(--blue);border-radius:6px;transition:width .6s ease;"></div>
        </div>
      </div>`;
    if (i < pipeline.length - 1){
      const nextCount = Number(pipeline[i+1].count) || 0;
      const rate = count > 0 ? Math.round((nextCount / count) * 1000) / 10 : 0;
      html += `<div style="text-align:center;font-size:11.5px;color:var(--gray-400);margin-bottom:6px;">↓ 전환율 ${rate}%</div>`;
    }
  });
  html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-200);text-align:center;font-size:13px;color:var(--gray-900);font-weight:700;">최종 전환율 ${finalRate}%</div>`;
  el.innerHTML = html;
}

function renderRank(elId, items){
  const el = document.getElementById(elId);
  if (!items.length){ el.innerHTML = '<div class="empty-msg">데이터가 없습니다</div>'; return; }

  const sorted = [...items].sort((a,b) => (Number(b.amount)||0) - (Number(a.amount)||0));
  const maxAmt = Math.max(...sorted.map(r => Number(r.amount) || 0)) || 1;

  let html = '';
  sorted.forEach((r, i) => {
    const amt = Number(r.amount) || 0;
    const pct = (amt / maxAmt) * 100;
    html += `
      <div class="rank-row">
        <span class="rank-idx">${i+1}</span>
        <span class="rank-name">${r.name}</span>
        <span class="rank-bar-track"><span class="rank-bar-fill" style="width:${pct}%"></span></span>
        <span class="rank-amount">${wonShort(amt)}</span>
      </div>`;
  });
  el.innerHTML = html;
}

loadAll();
</script>
</body>
</html>
